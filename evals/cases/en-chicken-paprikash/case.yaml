id: en-chicken-paprikash
title: Chicken Paprikash
language: en
input: input.txt
source: https://en.wikibooks.org/w/index.php?title=Cookbook%3AChicken%20Paprikash&oldid=4510904
license: CC BY-SA 4.0, Wikibooks contributors
reviewed: false
traps:
  - Servings stated (4), so they must be read, not inferred
  - Equipment section lists tools explicitly
  - Many ingredients without amounts (paprika, onion, water, salt)
  - Ranges, "2–3 cups" flour and "2–3 eggs"; the model has no range type yet
  - Bacon grease appears twice in the list (for the chicken and for the dumplings)
  - Vegan stress test, meat, dairy and eggs in one dish
  - Rye bread only appears in the notes

expect:
  servings:
    status_any: [read]
    value: 4
  ingredients:
    - match: [chicken]
      quantity: {accept: [{value: 1}]}
    - match: [bacon grease, lard, fat]
      max_count: 2
      note: Listed twice. Merging into one or keeping two (one per use) are both acceptable.
    - match: [sour cream]
      quantity: {accept: [{value: 2}]}
    - match: [paprika]
      quantity: {kind_any: [absent, to_taste, vague]}
    - match: [onion]
      quantity: {kind_any: [absent, vague]}
    - match: [flour]
      quantity:
        accept:
          - {value: 2, unit: [cup, cups]}
          - {value: 2.5, unit: [cup, cups]}
          - {value: 3, unit: [cup, cups]}
      note: Written as 2–3 cups. Any value in the range passes until ranges are modelled.
    - match: [egg]
      quantity: {accept: [{value: 2}, {value: 2.5}, {value: 3}]}
    - match: [water]
      quantity: {kind_any: [absent, vague]}
    - match: [salt]
      quantity: {kind_any: [absent, to_taste, vague]}
  absent_ingredients: [rye, bread]
  ingredient_count: {min: 9, max: 10}
  tools:
    - match: [big pot, pot]
      stated: true
    - match: [lid]
      stated: true
    - match: [skillet, pan]
    - match: [spoon]
    - match: [bowl]
  step_count: {min: 8, max: 14}
