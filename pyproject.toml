[project]
name = "cookbook"
version = "0.1.0"
description = "AI-powered cookbook pipeline: ingest, extract, manipulate, output."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cookbook"]

[tool.pytest.ini_options]
testpaths = ["tests"]
