[project]
name = "cookbook"
version = "0.1.0"
description = "AI-powered cookbook pipeline: ingest, extract, manipulate, output."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.9.0",
    "pydantic>=2.9",
    "pymupdf>=2.1",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
]

[project.scripts]
cookbook = "cookbook.cli:main"

[project.optional-dependencies]
web = [
    "fastapi>=0.163.1",
    "python-multipart>=0.0.34",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cookbook"]

[tool.pytest.ini_options]
testpaths = ["tests"]
